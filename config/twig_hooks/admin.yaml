sylius_twig_hooks:
    hooks:
        # Suggestions grid
        'tmonier_ai_copilot.admin.ai_suggestion.index.content':
            demo_notice:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/shared/demo_notice.html.twig'
                configuration:
                    container: true
                priority: 250

        # Suggestion page
        'tmonier_ai_copilot.admin.ai_suggestion.show.content':
            demo_notice:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/shared/demo_notice.html.twig'
                configuration:
                    container: true
                priority: 150
            sections:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/ai_suggestion/show/sections.html.twig'
                priority: 0

        'tmonier_ai_copilot.admin.ai_suggestion.show.content.sections#left':
            details:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/ai_suggestion/show/details.html.twig'
                priority: 0

        'tmonier_ai_copilot.admin.ai_suggestion.show.content.sections#right':
            comparison:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/ai_suggestion/show/comparison.html.twig'
                priority: 0

        # Product edit page: one toolbar per locale, then the pending suggestions card
        'sylius_admin.product.update.content.form.sections.translations':
            tmonier_ai_copilot:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/product/translation_toolbar.html.twig'
                priority: -100

        'sylius_admin.product.update.content':
            tmonier_ai_copilot:
                template: '@TmonierSyliusAiCatalogCopilotPlugin/admin/product/suggestions_card.html.twig'
                priority: -40
